app = "iron-corner"
primary_region = "sin"

[build]

[env]
  PORT = "8787"
  SELF_URL = "https://iron-corner.fly.dev"
  PAY_ASSET = "hbar"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "data"
  destination = "/app/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
